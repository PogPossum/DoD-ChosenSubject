version: '3.8'

services:
  arcade-web:
    image: nginx:latest
    container_name: arcade-web
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html/ #icon and grain fix
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - arcade-net
    restart: unless-stopped

  arcade-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: arcade-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiMjhiZDZhYjk3ZDdmYzFkMzUwNjYzMGVlZWQwODA3ODkiLCJ0IjoiNWQyMDhlOTAtYzJlNS00YzUyLTk0YTQtZjU0NjNkMTRmNzc3IiwicyI6>
    networks:
      - arcade-net
    restart: unless-stopped

networks:
  arcade-net:
    driver: bridge
